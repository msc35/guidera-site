<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guidera: AI Tour Guide for iPhone</title>
  <meta name="description" content="Guidera is an iPhone AI tour guide that tells source-checked stories about any place on the map, in 9 languages.">
  <meta name="color-scheme" content="light dark">
  <link rel="canonical" href="https://guidera.live/">
  <meta property="og:title" content="Guidera: AI Tour Guide for iPhone">
  <meta property="og:description" content="Guidera is an iPhone AI tour guide that tells source-checked stories about any place on the map, in 9 languages.">
  <meta property="og:url" content="https://guidera.live/">
  <meta property="og:type" content="website">
  <style>
    :root {
      --bg: #fafaf7;
      --fg: #1a1a1a;
      --muted: #5a5a5a;
      --accent: #0a66d8;
      --accent-fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111214;
        --fg: #f2f2f2;
        --muted: #a8a8a8;
        --accent: #4d9bff;
        --accent-fg: #0b0b0b;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 36rem; text-align: center; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 .5rem; letter-spacing: -0.02em; }
    p { font-size: 1.125rem; color: var(--muted); margin: 0 0 2rem; }
    a.cta {
      display: inline-block;
      padding: .875rem 1.5rem;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-fg);
      font-weight: 600;
      text-decoration: none;
    }
    a.cta:hover, a.cta:focus-visible { opacity: .9; }
    a.cta:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Guidera</h1>
    <p>Guidera is an iPhone AI tour guide that tells source-checked stories about any place on the map, in 9 languages.</p>
    <a class="cta" href="https://apps.apple.com/app/id6762008171">Download on the App Store</a>
  </main>
</body>
</html>
